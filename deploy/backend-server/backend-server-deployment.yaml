---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-server-deployment-article-arena
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-server-article-arena
  template:
    metadata:
      labels:
        app: backend-server-article-arena
    spec:
      containers:
        - name: backend-server-article-arena-container
          image: aman55/articlearena:v3.2.8
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              memory: "128Mi"
              cpu: "500m"
          ports:
            - containerPort: 8081
          env:
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: mongo-creds
            # - name: SERVICE_NAME
            #   valueFrom:
            #     configMapKeyRef:
            #       key: servicename
            #       name: article-arena-cm
            # - name: CONFIG_DBNAME
            #   valueFrom:
            #     secretKeyRef:
            #       key: dbname
            #       name: article-arena-cm
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  key: username
                  name: mongo-creds
            # - name: CONFIG_DBHOST_PORT
            #   valueFrom:
            #     configMapKeyRef:
            #       key: dbhostport
            #       name: article-arena-cm
